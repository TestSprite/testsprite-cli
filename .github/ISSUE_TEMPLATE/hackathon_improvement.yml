name: 🏆 Hackathon Improvement
description: Submit an improvement, fix, or contribution for the TestSprite CLI hackathon.
title: '[Hackathon] '
labels: ['hackathon', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for participating in the TestSprite CLI hackathon! 🎉

        Please search
        [existing issues](https://github.com/TestSprite/testsprite-cli/issues)
        first to avoid duplicates. Questions? Join us on
        [Discord](https://discord.gg/GXWFjCe4an).

        **What happens after you submit:** a maintainer triages this like any
        other issue — first response is best-effort within 5 business days
        (see [CONTRIBUTING.md](https://github.com/TestSprite/testsprite-cli/blob/main/CONTRIBUTING.md)).
        If it's a real, reproducible improvement, we'll confirm it, label it,
        and follow up about the reward via the Discord identity below.
        `hackathon` issues are exempt from our stale-issue bot, so this won't
        get auto-closed if it sits — but that also means it won't self-resolve;
        if you haven't heard anything past that window, ping us on Discord
        rather than assume it's in progress.
  - type: input
    id: verified-against
    attributes:
      label: Verified against (commit SHA or released version)
      description: >-
        This public repo is a periodic snapshot of our internal source —
        `main` here can be ahead of the last version published to npm, and a
        commit can already contain a fix that hasn't been released yet.
        State the exact commit SHA you read/tested against, or the released
        version (output of `testsprite --version`) if you installed and ran
        the CLI. This lets us catch "already fixed" reports before anyone
        spends time on a PR against a shipped fix.
      placeholder: e.g. commit a1b2c3d, or v0.6.0 (from `testsprite --version`)
    validations:
      required: true
  - type: input
    id: discord
    attributes:
      label: Discord Username / User ID
      description: Please provide your exact Discord username or unique User ID so we can contact you regarding your reward.
      placeholder: e.g. yourname or 123456789012345678
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What does this improvement do?
      description: A clear and concise description of the improvement, fix, or contribution.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details / implementation notes
      description: Link a PR if you have one, describe your approach, and note anything reviewers should know.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmations
      options:
        - label: I have searched existing issues and this is not a duplicate.
          required: true
        - label: I have provided my Discord identity above for reward coordination.
          required: true
