name: 🐛 Bug report
description: Report something that is broken or behaving unexpectedly in the CLI.
title: 'bug: '
labels: ['bug', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug! Please search
        [existing issues](https://github.com/TestSprite/testsprite-cli/issues)
        first to avoid duplicates.

        For **questions or usage help**, please use
        [GitHub Discussions](https://github.com/TestSprite/testsprite-cli/discussions)
        or [Discord](https://discord.gg/W4JDrZfdB) instead — issues are for bugs
        and feature requests.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug, including what you expected to happen instead.
      placeholder: When I run `testsprite test run ...`, I expected X but got Y.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact commands you ran, in order. Redact any API keys or private URLs.
      placeholder: |
        1. testsprite setup ...
        2. testsprite test run <id> --wait
        3. ...
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: |
        Paste the command output. Re-run with `--verbose` or `--debug` for more
        detail if you can. **Remove any API keys, credentials, or private URLs.**
      render: shell
    validations:
      required: false
  - type: input
    id: cli-version
    attributes:
      label: CLI version
      description: >-
        The version of the CLI you ran (output of `testsprite --version`).
        This is what you ran — see "Verified against" below for what the
        report is actually about.
      placeholder: e.g. 0.1.2
    validations:
      required: true
  - type: input
    id: verified-against
    attributes:
      label: Verified against (commit SHA or released version)
      description: >-
        A different question from "CLI version" above: that one is what you
        ran, this one is what code the report is actually about. If you
        installed and ran the CLI, the two happen to be the same value —
        fill in the same version again. If instead this report is based on
        reading the source rather than running an installed CLI, put the
        exact commit SHA you read. We ask separately because this public
        repo is a periodic snapshot of our internal source — `main` here can
        be ahead of the last version published to npm, and a commit can
        already contain a fix that hasn't been released yet. This field
        lets us catch an "already fixed" report before anyone spends time
        on it.
      placeholder: e.g. commit a1b2c3d, or v0.6.0 (same as CLI version above)
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of `node --version` (the CLI requires Node >= 20).
      placeholder: e.g. v22.11.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. macOS 15.5 / Ubuntu 24.04 / Windows 11
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmations
      options:
        - label: I have searched existing issues and this is not a duplicate.
          required: true
        - label: I am on the latest published version, or have noted why I cannot upgrade.
          required: true
        - label: I have removed any secrets (API keys, credentials, private URLs) from this report.
          required: true
