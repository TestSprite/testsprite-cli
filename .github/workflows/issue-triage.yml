# P1-2 issue auto-assign + 3-slot-cap bot (InsForge `agent-zhang-beihai` pattern).
# Posts as the `testsprite-hob` GitHub App ⇒ `testsprite-hob[bot]`.
#
# Setup (one-time, by an org admin):
#   1. Create a GitHub App named `testsprite-hob` (org Settings → Developer settings →
#      GitHub Apps → New). Permissions: Issues = Read & write, Metadata = Read. No webhook.
#      Generate a private key; install the App on the public testsprite-cli repo.
#   2. Add two repo (or org) secrets:
#        TESTSPRITE_HOB_APP_ID        = the App's numeric App ID
#        TESTSPRITE_HOB_PRIVATE_KEY   = the App's .pem private key (full contents)
#      (The ALFHEIM_AGENT_* fallbacks are this App's original secret names from
#      before it was renamed — same App ID + key; either naming works.)
#   Until those exist, the bot gracefully falls back to github-actions[bot] (still works).
#
# Fires on each new issue comment; assigns the commenter when they claim an issue
# (e.g. "/assign" or "I'd like to work on this") and reports their open-assignment count.
name: Issue triage (auto-assign + slot cap)

on:
  issue_comment:
    types: [created]

permissions:
  issues: write # assign/unassign + comment + (re)label; nothing else

env:
  SLOT_CAP: '3'
  # D2: the cap ships ARMED, NOT ENFORCED. report-only by default — assigns anyway,
  # just surfaces slot usage. Flip to 'true' if an AI-PR flood appears.
  ENFORCE_CAP: 'false'

jobs:
  triage:
    # Public repo only — this file also lives in the private mirror (atlas),
    # where issue-first claiming doesn't apply; the three sibling bots
    # (pr-triage.yml, ci-nudge.yml, stale.yml) all carry this same fence and
    # this one was missing it (found in the 2026-07-15 OSS-P2 audit — the
    # /assign bot was live on atlas too until this fix).
    # issues only (issue_comment also fires on PRs), and never react to a bot's own
    # comment — incl. our own testsprite-hob[bot], which (unlike GITHUB_TOKEN) would
    # otherwise re-trigger this workflow. `type == 'Bot'` covers both bot identities.
    if: >-
      github.repository == 'TestSprite/testsprite-cli' &&
      !github.event.issue.pull_request &&
      github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      # Mint a token for the testsprite-hob App so comments post as testsprite-hob[bot].
      # continue-on-error: until the App + secrets exist this no-ops and we fall back below.
      - id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.TESTSPRITE_HOB_APP_ID || secrets.ALFHEIM_AGENT_APP_ID }}
          private-key: ${{ secrets.TESTSPRITE_HOB_PRIVATE_KEY || secrets.ALFHEIM_AGENT_PRIVATE_KEY }}
          # Scope the minted token to what this job uses (issues API only) instead
          # of inheriting the App's full installation permissions.
          permission-issues: write

      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          # App token when available (→ testsprite-hob[bot]); else the default
          # GITHUB_TOKEN (→ github-actions[bot]). Either way the logic is identical.
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          script: |
            const cap = parseInt(process.env.SLOT_CAP, 10);
            const enforce = process.env.ENFORCE_CAP === 'true';
            const { owner, repo } = context.repo;
            const issue = context.payload.issue.number;
            const user = context.payload.comment.user.login;

            // Drop fenced code blocks, indented code blocks, inline code
            // spans (any backtick-run length), and blockquoted (`> `) lines
            // before matching. Without this, the literal text "/assign"
            // reaches the matcher any time it's quoted or shown as an
            // example rather than issued as a command (someone's prior
            // comment quoted back, a code sample, etc.). Every stripped run
            // is replaced by a same-position, no-newline placeholder ('x')
            // rather than deleted outright — deleting a mid-line span like
            // "`foo` /assign" would slide the remaining text to the start
            // of the line and manufacture a line-start match that was never
            // really there.
            function stripQuotedAndCode(input) {
              if (input == null) return '';
              const PLACEHOLDER = 'x';

              // Normalize CRLF up front so every line-based check below only
              // has to reason about one line-ending style.
              const lines = String(input).replace(/\r\n/g, '\n').split('\n');

              // (a) Fenced code blocks (``` or ~~~, 3+ of the same char, up
              // to 3 leading spaces per CommonMark). A fence that never
              // finds a same-character closer of >= its own length runs to
              // the end of the body — every line from the opener onward is
              // blanked; it can never "reopen" into real text.
              let fenceChar = null;
              let fenceLen = 0;
              for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                if (fenceChar) {
                  const close = line.match(/^ {0,3}([`~])(\1*)\s*$/);
                  if (close && close[1] === fenceChar && 1 + close[2].length >= fenceLen) {
                    fenceChar = null;
                    fenceLen = 0;
                  }
                  lines[i] = PLACEHOLDER;
                  continue;
                }
                const open = line.match(/^ {0,3}([`~])(\1{2,})/);
                if (open) {
                  fenceChar = open[1];
                  fenceLen = 1 + open[2].length;
                  lines[i] = PLACEHOLDER;
                }
              }

              // (b) Indented code blocks: 4+ leading spaces or a leading
              // tab, anchored at the true start of the line — this is what
              // a maintainer's own "comment /assign if you want it" prose
              // never accidentally satisfies.
              // (d) Blockquoted lines (`> ...`) are prior commentary being
              // quoted back, not something the commenter is asserting now.
              for (let i = 0; i < lines.length; i++) {
                if (/^(?: {4,}|\t)/.test(lines[i]) || /^\s*>/.test(lines[i])) {
                  lines[i] = PLACEHOLDER;
                }
              }

              // (c) Inline code spans, matched by backtick-RUN length (a
              // doubled delimiter only closes against another doubled
              // delimiter — a naive /`[^`]*`/ gets this wrong: it treats
              // each backtick of "``/assign" as its own empty span and
              // leaves "/assign" exposed at the start of the line). An
              // opener with no same-length closer anywhere later in the
              // body is unclosed and runs to the end of the body, exactly
              // like an unclosed fence. Implemented as one left-to-right
              // scan (no backreference/lazy-star regex) so this stays
              // linear-time even on a pathological multi-megabyte body.
              const text = lines.join('\n');
              let out = '';
              let i = 0;
              while (i < text.length) {
                const tick = text.indexOf('`', i);
                if (tick === -1) { out += text.slice(i); break; }
                out += text.slice(i, tick);
                let j = tick;
                while (j < text.length && text[j] === '`') j++;
                const openLen = j - tick;
                let k = j;
                let closeEnd = -1;
                while (k < text.length) {
                  const nextTick = text.indexOf('`', k);
                  if (nextTick === -1) break;
                  let m = nextTick;
                  while (m < text.length && text[m] === '`') m++;
                  if (m - nextTick === openLen) { closeEnd = m; break; }
                  k = m;
                }
                const spanEnd = closeEnd === -1 ? text.length : closeEnd;
                for (let p = tick; p < spanEnd; p++) out += text[p] === '\n' ? '\n' : PLACEHOLDER;
                i = spanEnd;
              }
              return out;
            }

            const body = stripQuotedAndCode(context.payload.comment.body || '').toLowerCase();

            // Slash commands are anchored to the START of their own line
            // (not "appears anywhere in the body"), matched against the
            // quote/code-stripped text above, with an optional leading
            // markdown list marker (`- `, `* `, `1. `, `1) `) so claiming
            // from a checklist still works. Without the line-anchor, a
            // maintainer can never write ordinary triage prose like
            // "comment /assign if you want it" without self-assigning — and
            // the natural follow-up explaining the mistake ("open for
            // anyone to claim with /assign") re-triggers the exact same bug
            // on itself, so there is no comment text that escapes the trap.
            // A real claim is still just `/assign` (optionally behind a
            // list marker, or with more text after it), starting its own
            // line, not embedded mid-sentence.
            const wantsAssign = /^\s*(?:[-*+]\s+|\d+[.)]\s+)?\/assign\b/m.test(body)
              || /\bi('?d| would)? ?(like|want) to (work on|take|tackle) this\b/.test(body)
              || /\bcan i (work on|take|have|grab) this\b/.test(body)
              || /\bi'?ll (work on|take|tackle) this\b/.test(body);
            const wantsUnassign = /^\s*(?:[-*+]\s+|\d+[.)]\s+)?\/unassign\b/m.test(body)
              || /\bi (can'?t|cannot) (continue|work on this)\b/.test(body);
            if (!wantsAssign && !wantsUnassign) return; // nothing to do

            // List THIS user's currently-open assigned issues (exclude PRs).
            const assigned = (await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', assignee: user, per_page: 100,
            })).filter(i => !i.pull_request);
            const list = assigned.length
              ? assigned.map(i => `- ${owner}/${repo}#${i.number} — ${i.title}`).join('\n')
              : '_(none)_';

            if (wantsUnassign) {
              const { data: afterUnassign } = await github.rest.issues.removeAssignees({
                owner, repo, issue_number: issue, assignees: [user],
              });
              // label hygiene: in-progress means "someone has claimed this" — once
              // nobody is left assigned, drop it too (best-effort, mirrors the
              // needs-triage/in-progress swap on the assign path below).
              if (!afterUnassign.assignees || afterUnassign.assignees.length === 0) {
                try { await github.rest.issues.removeLabel({ owner, repo, issue_number: issue, name: 'in-progress' }); } catch {}
              }
              await github.rest.issues.createComment({ owner, repo, issue_number: issue,
                body: `Unassigned @${user}. Thanks for the update — freeing this up for someone else.` });
              return;
            }

            const already = assigned.some(i => i.number === issue);
            const atCap = assigned.length >= cap;

            if (atCap && enforce && !already) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue,
                body: `Thanks @${user}! You're at the ${cap}-issue limit, so I haven't assigned this one. `
                    + `Please finish or \`/unassign\` one first, then comment again here.\n\n`
                    + `Your open assigned issues (${assigned.length}/${cap}):\n${list}` });
              return;
            }

            if (!already) {
              await github.rest.issues.addAssignees({ owner, repo, issue_number: issue, assignees: [user] });
              // label hygiene: move needs-triage → in-progress (best-effort)
              try { await github.rest.issues.removeLabel({ owner, repo, issue_number: issue, name: 'needs-triage' }); } catch {}
              try { await github.rest.issues.addLabels({ owner, repo, issue_number: issue, labels: ['in-progress'] }); } catch {}
            }
            const countNow = already ? assigned.length : assigned.length + 1;
            const remaining = Math.max(0, cap - countNow);
            const overCap = countNow > cap; // only possible in report-only mode
            const slots = overCap
              ? `⚠️ You're now over the soft ${cap}-issue limit (${countNow}/${cap}). Consider finishing one before taking more.`
              : `(${remaining} more slot${remaining === 1 ? '' : 's'} available.)`;
            await github.rest.issues.createComment({ owner, repo, issue_number: issue,
              body: `Assigned to @${user}. Thanks for taking this on. ${slots}\n\n`
                  + `Your open assigned issues (${countNow}/${cap}):\n${list}` });
