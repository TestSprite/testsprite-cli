# backport-dispatch.yml — OPTIONAL latency optimization for atlas's
# auto-backport bot. Authored in atlas (release/public path), ships to the
# PUBLIC repo via the snapshot per invariant I0 — this workflow only ever
# runs on the public repo, never on atlas (see the repo guard below).
#
# NOT ARMED by default: the atlas-side auto-backport.yml has a scheduled
# SWEEP (every ~30 min) that scans merged public PRs anonymously and
# backports anything unabsorbed — the whole pipeline is fully functional
# with ZERO public-repo credentials via that path alone. This workflow only
# shaves that latency down to seconds (instead of up to ~30 minutes) when a
# dedicated credential is configured — a nice-to-have, never a requirement.
#
# Arming it means creating a NEW, single-purpose GitHub App and never
# reusing a broader-scoped one that already exists for something else:
#   - permission: contents:write on the target repo, and ONLY that
#   - installed ONLY on TestSprite/testsprite-cli-atlas — never org-wide
#   - its App ID / private key stored as BACKPORT_DISPATCH_APP_ID /
#     BACKPORT_DISPATCH_APP_PRIVATE_KEY secrets on THIS (public) repo
# Placing a cross-repo push credential into a public repo's secret store is
# a real trust decision (a compromised secret store would let an attacker
# push to atlas) — left to the operator, not decided by this file, and
# never satisfied by falling back to some other App this org already runs
# for an unrelated purpose (broader install footprint, broader
# permissions — a strictly worse blast radius for no benefit here). Until
# both secrets above exist on this repo, this workflow no-ops cleanly (see
# the final step) — it does NOT fail loud, so it stays quiet for every
# contributor watching the Actions tab.
#
# SECURITY: this workflow reads ONLY event metadata (PR number, merge SHA,
# base ref) — it never checks out the merged PR's code. That is what makes
# `pull_request_target` safe here: the base-repo context (secrets, a
# write-capable token) is required because a fork-originated merged PR gets
# ZERO secrets under a plain `pull_request` trigger, even for the `closed`
# activity type — but nothing in this job ever runs untrusted fork code, so
# the classic pull_request_target RCE/secret-exfiltration risk (checking
# out and executing the fork's own head ref under a privileged context)
# does not apply. Do not add actions/checkout to this workflow.
name: Notify atlas of a merged public PR

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read

jobs:
  notify:
    if: github.repository == 'TestSprite/testsprite-cli' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      BACKPORT_DISPATCH_APP_ID: ${{ secrets.BACKPORT_DISPATCH_APP_ID }}
      BACKPORT_DISPATCH_APP_PRIVATE_KEY: ${{ secrets.BACKPORT_DISPATCH_APP_PRIVATE_KEY }}
    steps:
      - id: app-token
        if: env.BACKPORT_DISPATCH_APP_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ env.BACKPORT_DISPATCH_APP_ID }}
          private-key: ${{ env.BACKPORT_DISPATCH_APP_PRIVATE_KEY }}
          owner: TestSprite
          repositories: testsprite-cli-atlas
          # Minimum required for POST /repos/{owner}/{repo}/dispatches (verified
          # against docs.github.com/en/rest/using-the-rest-api/permissions-required-for-github-apps —
          # the endpoint is gated on Contents:write, not Contents:read).
          permission-contents: write

      - name: Dispatch to atlas
        if: steps.app-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # These two fields are fork-influenced (merge_commit_sha/base.ref come
          # from a merged PR's event payload) — routed through env instead of
          # spliced into the run: string to avoid the GHA script-injection class
          # (a maliciously-crafted value could otherwise break out of the -F
          # argument and inject arbitrary shell). PR_NUMBER is left inline: it is
          # a GitHub-assigned integer, not attacker-authorable content.
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          gh api repos/TestSprite/testsprite-cli-atlas/dispatches \
            -f event_type=public-pr-merged \
            -F 'client_payload[pr_number]=${{ github.event.pull_request.number }}' \
            -F "client_payload[merge_commit_sha]=$MERGE_SHA" \
            -F "client_payload[base_ref]=$BASE_REF"

      - name: No dedicated dispatch credential configured
        if: env.BACKPORT_DISPATCH_APP_ID == ''
        run: |
          echo "::notice::No dedicated backport-dispatch credential is configured on this repo — atlas's scheduled sweep picks up this merge within about half an hour instead of an instant dispatch."

      # Distinct from the "not configured" case above: an ID is set but the
      # mint step (continue-on-error: true) failed anyway, e.g. the App
      # isn't actually installed on this repo, or the private key is wrong
      # or missing. Both cases leave steps.app-token.outputs.token == '',
      # so without this split a broken credential silently reads as "never
      # armed" instead of "armed but broken".
      - name: Dispatch credential configured but the token mint failed
        if: env.BACKPORT_DISPATCH_APP_ID != '' && steps.app-token.outputs.token == ''
        run: |
          echo "::warning::BACKPORT_DISPATCH_APP_ID is configured but the token mint failed (check the App's installation on atlas and BACKPORT_DISPATCH_APP_PRIVATE_KEY) — falling back to the scheduled sweep this run."
