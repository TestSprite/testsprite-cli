# Sweep open issue claims hourly: warn at 72 hours and release at 96 hours
# unless the assignee has an open PR linked to the issue. This is separate
# from stale.yml because stale tracks inactivity in days and exempts the
# labels used by the contributor claim flow.
name: Claim TTL

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Log intended actions without changing issues
        type: boolean
        default: false

permissions:
  issues: write
  contents: read

concurrency:
  group: claim-ttl
  cancel-in-progress: false

env:
  CLAIM_TTL_HOURS: '96'
  CLAIM_WARN_HOURS: '72'
  CLAIM_TTL_SINCE: '2026-09-24T00:00:00Z'
  DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}

jobs:
  sweep:
    if: github.repository == 'TestSprite/testsprite-cli'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Mint a token for the testsprite-hob App so comments post as testsprite-hob[bot].
      # continue-on-error: until the App + secrets exist this no-ops and we fall back below.
      - id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.TESTSPRITE_HOB_APP_ID || secrets.ALFHEIM_AGENT_APP_ID }}
          private-key: ${{ secrets.TESTSPRITE_HOB_PRIVATE_KEY || secrets.ALFHEIM_AGENT_PRIVATE_KEY }}
          # Scope the minted token to what this job uses (issues API only) instead
          # of inheriting the App's full installation permissions.
          permission-issues: write

      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          # App token when available (→ testsprite-hob[bot]); else the default
          # GITHUB_TOKEN (→ github-actions[bot]). Either way the logic is identical.
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          script: |
            const { run } = await import(`${{ github.workspace }}/.github/scripts/claim-ttl.mjs`);
            await run({ github, context, core, env: process.env });
