# Label an issue when it opens, so it reaches the triage queue however it was
# created. A template's `labels:` is applied only on the web form; the REST API
# and `gh issue create` bypass the template, so issues opened that way arrive
# bare and can never be triaged, accepted or claimed. Only ever labels an issue
# that has none, so a web-form issue is left exactly as its template set it up.
# The `bug` / `enhancement` call stays with a human.
name: Issue label on open

on:
  issues:
    types: [opened]

permissions:
  issues: write # add labels

jobs:
  label:
    if: github.repository == 'TestSprite/testsprite-cli'
    runs-on: ubuntu-latest
    steps:
      - id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.TESTSPRITE_HOB_APP_ID || secrets.ALFHEIM_AGENT_APP_ID }}
          private-key: ${{ secrets.TESTSPRITE_HOB_PRIVATE_KEY || secrets.ALFHEIM_AGENT_PRIVATE_KEY }}
          permission-issues: write

      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          script: |
            const { owner, repo } = context.repo;
            const issue = context.payload.issue;

            // A web-form issue already carries its template's labels.
            if ((issue.labels || []).length > 0) return;

            // `needs-triage` unconditionally: a free-form title has no prefix to
            // match on, and an unlabelled issue never reaches the queue at all.
            const labels = ['needs-triage'];
            if (/^\s*\[hackathon\]/i.test(issue.title || '')) labels.push('hackathon');

            await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels });
